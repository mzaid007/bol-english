<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b14"/>
      <stop offset="50%" stop-color="#030307"/>
      <stop offset="100%" stop-color="#120c24"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Cap Fill Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Ambient Glow Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#brandGrad)" stroke-width="12" opacity="0.3" filter="url(#neonGlow)"/>

  <!-- Main Speech Bubble Shape -->
  <path d="M 120,160 C 120,110 160,70 210,70 L 302,70 C 352,70 392,110 392,160 L 392,260 C 392,310 352,350 302,350 L 230,350 L 160,400 L 175,350 C 140,340 120,305 120,260 Z" 
        fill="url(#brandGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Inner Dark Mask for Speech Bubble -->
  <path d="M 136,168 C 136,128 168,96 208,96 L 304,96 C 344,96 376,128 376,168 L 376,252 C 376,292 344,324 304,324 L 220,324 L 176,356 L 186,320 C 156,310 136,282 136,252 Z" 
        fill="#080711"/>

  <!-- Graduation Cap (Learning Symbol) -->
  <!-- Cap Diamond Roof -->
  <polygon points="256,130 340,170 256,210 172,170" fill="url(#capGrad)" />
  <!-- Cap Under Base -->
  <path d="M 200,184 L 200,215 C 200,235 312,235 312,215 L 312,184" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Cap Tassel -->
  <path d="M 320,170 L 338,205 L 338,230" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="338" cy="233" r="7" fill="#38bdf8" />

  <!-- Sparkling AI Learning Star (Top Right) -->
  <path d="M 390,120 Q 390,145 415,145 Q 390,145 390,170 Q 390,145 365,145 Q 390,145 390,120 Z" fill="#38bdf8" />
  <!-- Small Star (Bottom Left) -->
  <path d="M 125,320 Q 125,335 140,335 Q 125,335 125,350 Q 125,335 110,335 Q 125,335 125,320 Z" fill="#ec4899" />
</svg>